version: "3.8"

services:
  mysql_db:
    image: mysql:8.0
    container_name: express_mysql_container
    restart: always
    environment:
      MYSQL_DATABASE: photoclash_database
      MYSQL_USER: photoclash_user
      MYSQL_PASSWORD: jupiter
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
